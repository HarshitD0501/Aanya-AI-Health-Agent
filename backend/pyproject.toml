[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aanya-ai-health-agent"
version = "1.0.0"
description = "Aanya - Real-Time Multilingual Voice AI Health Advisor powered by LiveKit and Murf Falcon TTS"
readme = "README.md"
authors = [
    { name = "Harshit Dubey", email = "dubeyharshit5015@gmail.com" }
]
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[deepgram,google,silero,turn-detector]~=1.4",
    "livekit-murf>=0.1.1",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
